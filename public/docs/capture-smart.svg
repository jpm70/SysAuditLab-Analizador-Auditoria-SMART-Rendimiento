<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <rect width="1200" height="650" fill="#090d16" rx="12"/>
  <rect x="1" y="1" width="1198" height="648" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="52" fill="#050811"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1e293b"/>
  <text x="28" y="31" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">SysAudit Lab · Auditoría S.M.A.R.T. y Escáner de Superficie LBA</text>
  <text x="910" y="31" fill="#38bdf8" font-family="monospace" font-size="12">https://www.unfantasmaenelsistema.com/</text>

  <!-- Drive Cards -->
  <rect x="24" y="68" width="564" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="94" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Unidad 0: Seagate BarraCuda Pro 2TB (Volumen D:)</text>
  <text x="415" y="94" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">▲ CRÍTICO (PRE-FALLO)</text>
  <text x="44" y="114" fill="#94a3b8" font-family="monospace" font-size="11">SATA III 6.0 Gb/s · S/N Z491K8LM · FW SDM1</text>
  <text x="44" y="138" fill="#cbd5e1" font-family="monospace" font-size="11">Salud Estimada: 58% · Temp Sensor: 44°C · Encendido: 18420 h · Ciclos: 2140</text>

  <rect x="612" y="68" width="564" height="84" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="632" y="94" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Unidad 1: Samsung PM9A1 NVMe 512GB (Sistema C:)</text>
  <text x="1030" y="94" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">● SALUD NOMINAL</text>
  <text x="632" y="114" fill="#94a3b8" font-family="monospace" font-size="11">NVMe PCIe 4.0 x4 · S/N S661NX0R802114 · FW GXA7401Q</text>
  <text x="632" y="138" fill="#cbd5e1" font-family="monospace" font-size="11">Salud Estimada: 95% · Temp Sensor: 48°C · Encendido: 6120 h · Ciclos: 890</text>

  <!-- Left S.M.A.R.T. Table -->
  <rect x="24" y="168" width="750" height="260" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="42" y="194" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Tabla de Atributos S.M.A.R.T. — Seagate BarraCuda Pro 2TB</text>
  <rect x="520" y="176" width="236" height="28" rx="6" fill="#d97706"/>
  <text x="534" y="194" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Forzar Remapeo LBA (C5 → 05)</text>
  <line x1="24" y1="212" x2="774" y2="212" stroke="#1e293b"/>

  <text x="42" y="232" fill="#94a3b8" font-family="monospace" font-size="11">ID HEX   ATRIBUTO S.M.A.R.T.                      ACTUAL  PEOR  UMBRAL   VALOR CRUDO (RAW)      DIAGNÓSTICO</text>
  <line x1="24" y1="242" x2="774" y2="242" stroke="#1e293b"/>

  <text x="42" y="264" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">0x01</text>
  <text x="105" y="264" fill="#e2e8f0" font-family="sans-serif" font-size="12">Tasa de Errores de Lectura Cruda</text>
  <text x="395" y="264" fill="#e2e8f0" font-family="monospace" font-size="12">72      68    44       1482 (0x05CA)</text>
  <text x="665" y="264" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">◆ ADVERTENCIA</text>

  <text x="42" y="298" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">0x05</text>
  <text x="105" y="298" fill="#e2e8f0" font-family="sans-serif" font-size="12">Contador de Sectores Reasignados</text>
  <text x="395" y="298" fill="#e2e8f0" font-family="monospace" font-size="12">64      64    36       48 sectores</text>
  <text x="665" y="298" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">◆ ADVERTENCIA</text>

  <rect x="25" y="314" width="748" height="36" fill="#0c4a6e" fill-opacity="0.45"/>
  <text x="42" y="336" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">0xC5</text>
  <text x="105" y="336" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Sectores Pendientes de Reasignación</text>
  <text x="395" y="336" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">32      32    30       14 inestables</text>
  <text x="665" y="336" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">▲ CRÍTICO</text>

  <text x="42" y="374" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">0xC6</text>
  <text x="105" y="374" fill="#e2e8f0" font-family="sans-serif" font-size="12">Sectores Incorregibles Offline (ECC)</text>
  <text x="395" y="374" fill="#e2e8f0" font-family="monospace" font-size="12">92      92    10       3 sectores</text>
  <text x="665" y="374" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">◆ ADVERTENCIA</text>

  <text x="42" y="408" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">0xC2</text>
  <text x="105" y="408" fill="#e2e8f0" font-family="sans-serif" font-size="12">Temperatura Interna de Unidad</text>
  <text x="395" y="408" fill="#e2e8f0" font-family="monospace" font-size="12">56      48    0        44 °C</text>
  <text x="665" y="408" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">● NOMINAL</text>

  <!-- LBA Surface Scanner -->
  <rect x="24" y="444" width="750" height="182" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="42" y="470" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Mapa de Superficie LBA y Tiempos de Acceso (128 Clústeres Auditados)</text>
  <text x="42" y="490" fill="#94a3b8" font-family="monospace" font-size="11">LBA 0x0042D800 · Latencia: 495 ms · ▲ ERROR CRC EN SECTOR PENDIENTE (ID 0xC5)</text>

  <!-- Blocks Row 1 -->
  <g transform="translate(42, 506)">
    <rect x="0" y="0" width="82" height="28" rx="4" fill="#064e3b" stroke="#10b981"/><text x="18" y="18" fill="#6ee7b7" font-family="monospace" font-size="11">LBA OK 6ms</text>
    <rect x="90" y="0" width="82" height="28" rx="4" fill="#064e3b" stroke="#10b981"/><text x="108" y="18" fill="#6ee7b7" font-family="monospace" font-size="11">LBA OK 7ms</text>
    <rect x="180" y="0" width="82" height="28" rx="4" fill="#78350f" stroke="#f59e0b"/><text x="192" y="18" fill="#fde68a" font-family="monospace" font-size="11">LENTO 120ms</text>
    <rect x="270" y="0" width="82" height="28" rx="4" fill="#991b1b" stroke="#f87171" stroke-width="2"/><text x="282" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">! C5 495ms</text>
    <rect x="360" y="0" width="82" height="28" rx="4" fill="#991b1b" stroke="#f87171"/><text x="372" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">! C5 460ms</text>
    <rect x="450" y="0" width="82" height="28" rx="4" fill="#0c4a6e" stroke="#38bdf8"/><text x="460" y="18" fill="#bae6fd" font-family="monospace" font-size="11">R Spare 05</text>
    <rect x="540" y="0" width="82" height="28" rx="4" fill="#0c4a6e" stroke="#38bdf8"/><text x="550" y="18" fill="#bae6fd" font-family="monospace" font-size="11">R Spare 05</text>
    <rect x="630" y="0" width="82" height="28" rx="4" fill="#064e3b" stroke="#10b981"/><text x="648" y="18" fill="#6ee7b7" font-family="monospace" font-size="11">LBA OK 6ms</text>
  </g>
  <text x="42" y="564" fill="#34d399" font-family="monospace" font-size="11">· &lt;15ms Nominal</text>
  <text x="180" y="564" fill="#fbbf24" font-family="monospace" font-size="11">~ 50-150ms Lento</text>
  <text x="330" y="564" fill="#38bdf8" font-family="monospace" font-size="11">R Reasignado en Spare Area (0x05)</text>
  <text x="575" y="564" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">! Pendiente Ilegible (0xC5)</text>

  <!-- Right Pedagogical Inspector -->
  <rect x="790" y="168" width="386" height="458" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="810" y="196" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">INTÉRPRETE TÉCNICO DE TELEMETRÍA S.M.A.R.T.</text>
  <text x="810" y="220" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">ID 0xC5 — Sectores Pendientes</text>
  <text x="810" y="240" fill="#94a3b8" font-family="monospace" font-size="12">Current_Pending_Sector · Pre-Fail Crítico</text>

  <rect x="810" y="258" width="346" height="58" rx="8" fill="#050811" stroke="#1e293b"/>
  <text x="832" y="278" fill="#94a3b8" font-family="monospace" font-size="10">NORMALIZADO         UMBRAL FALLO        VALOR CRUDO</text>
  <text x="855" y="302" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">32                  30                  14</text>

  <text x="810" y="346" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Cómo interpretar este parámetro en auditoría:</text>
  <text x="810" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="12">14 sectores LBA no pueden leerse correctamente y</text>
  <text x="810" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="12">esperan ser remapeados. Cuando un servicio como</text>
  <text x="810" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="12">SearchIndexer intenta leerlos, el disco entra en</text>
  <text x="810" y="430" fill="#cbd5e1" font-family="sans-serif" font-size="12">reintentos bloqueando todo el sistema operativo.</text>

  <rect x="810" y="458" width="346" height="142" rx="8" fill="#050811" stroke="#1e293b"/>
  <text x="826" y="482" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Regla de Oro para el Parte Preventivo:</text>
  <text x="826" y="506" fill="#94a3b8" font-family="sans-serif" font-size="11">En los atributos 0x05 (Reasignados) y 0xC5</text>
  <text x="826" y="524" fill="#94a3b8" font-family="sans-serif" font-size="11">(Pendientes), cualquier Valor Crudo mayor que 0</text>
  <text x="826" y="542" fill="#94a3b8" font-family="sans-serif" font-size="11">es una alerta temprana de degradación física que</text>
  <text x="826" y="560" fill="#94a3b8" font-family="sans-serif" font-size="11">exige clonado inmediato (ddrescue) y reemplazo.</text>
</svg>
